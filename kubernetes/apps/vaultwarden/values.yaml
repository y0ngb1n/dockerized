# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.2.1/charts/other/app-template/values.schema.json
app-template:
  controllers:
    main:
      forceRename: "{{ .Release.Name }}"
      containers:
        main:
          image:
            repository: ghcr.io/dani-garcia/vaultwarden
            tag: 1.37.3-alpine
            pullPolicy: IfNotPresent
          envFrom:
          - secretRef:
              identifier: app-secrets
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
  service:
    main:
      controller: main
      type: ClusterIP
      ports:
        http:
          port: 80
  ingress:
    main:
      enabled: true
      className: nginx
      annotations:
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
        nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
        nginx.ingress.kubernetes.io/rewrite-target: /
        nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
        nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
        nginx.ingress.kubernetes.io/proxy-body-size: 32m
        nginx.ingress.kubernetes.io/server-snippet: |
          client_header_buffer_size 64k;
          large_client_header_buffers 4 128k;
          location ~* "^/admin" {
            deny all;
            return 403;
          }
        nginx.ingress.kubernetes.io/configuration-snippet: |
          more_set_headers "Request-Id: $req_id";
          if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
            expires 30d;
            add_header Cache-Control "public";
          }
      hosts:
        - host: &host vault.example.com
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - hosts:
            - *host
          secretName: tls-example.com
  secrets:
    app-secrets:
      stringData:
        ##
        # https://github.com/dani-garcia/vaultwarden/blob/main/.env.template
        ##
        TZ: Asia/Shanghai
        DATA_FOLDER: &appDataPath /app/data
        # DATABASE_URL: /app/data/db.sqlite3
        # https://github.com/dani-garcia/vaultwarden/wiki/Enabling-admin-page#secure-the-admin_token
        ADMIN_TOKEN: "CHANGE_YOUR_ADMIN_TOKEN"
  persistence:
    app-data:
      # suffix: data ==> persistentvolumeclaim/vaultwarden-data
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 100Mi
      retain: true
      globalMounts:
      - path: *appDataPath